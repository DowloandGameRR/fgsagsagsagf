<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anonim Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import * as D from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app=initializeApp({
 apiKey:"AIzaSyDhfV_mNCJsD4rL6r8viKUHPgIn-_z01-s",
 authDomain:"itirafhelvaci.firebaseapp.com",
 databaseURL:"https://itirafhelvaci-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"itirafhelvaci",
 storageBucket:"itirafhelvaci.firebasestorage.app",
 messagingSenderId:"155382461179",
 appId:"1:155382461179:web:fb134296241b509c8a765e"
});
window.FB={...D,db:D.getDatabase(app)};
window.dispatchEvent(new Event('fb'));
</script>
<style>
:root{--bg:#070b14;--sf:#101725;--sf2:#0c1220;--ln:#22304a;--tx:#eaf2ff;--mu:#8ea3bf;--ac:#8b5cf6;--rd:#ff5f7a;--gn:#34d399;--h:'Bricolage Grotesque',system-ui;--b:'Instrument Sans',system-ui}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{height:100dvh;background:var(--bg);color:var(--tx);font:15px/1.45 var(--b);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{background:#0a0f1a;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
input:focus,textarea:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 4px #8b5cf622}
.btn{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.18s}
.btn:hover{border-color:var(--ac);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#8b5cf6;color:#fff;box-shadow:0 8px 24px #8b5cf644}
.btn.red{background:#3a1520;border-color:#7a2036;color:#ffb4c0}
.btn.sm{padding:6px 10px;font-size:13px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--mu);display:grid;place-items:center;transition:.18s}
.ib:hover{color:var(--ac);transform:translateY(-2px)}
.pill{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;background:var(--sf2);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln);background:#0b1120cc;backdrop-filter:blur(12px)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand h1{font:800 22px/1 var(--h);background:linear-gradient(90deg,#fff,#c4b5fd,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.brand p{color:var(--mu);font-size:12px}
.acts{display:flex;gap:6px;align-items:center}
.me{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me.admin{background:var(--ac);color:#fff;border-color:var(--ac)}
.me.mod{border-color:var(--ac);color:#c9b0ff}
.stream{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.m{display:flex;gap:8px;max-width:min(86%,520px);animation:msgIn .45s cubic-bezier(.2,1.2,.4,1)}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 13px var(--h);color:#0b0c11;background:var(--c,#8b5cf6)}
.mb{min-width:0}
.mh{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mu);margin-bottom:3px}
.mh b{color:var(--tx)}
.bub{background:var(--sf);border:1px solid var(--ln);padding:9px 13px;border-radius:18px;word-break:break-word;white-space:pre-wrap}
.m.me .bub{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#8b5cf6;color:#fff}
.m.adm .bub{border-color:var(--ac);box-shadow:0 0 18px #8b5cf644}
.m.mod .bub{border-color:#c9b0ff}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--ac);color:#fff}
.tag.mod{background:none;border:1px solid var(--ac);color:#c9b0ff}
.tools{display:flex;gap:4px;margin-top:4px;opacity:0;transition:.2s}
.m:hover .tools{opacity:1}
.tools button{font-size:12px;color:var(--mu);padding:4px 7px;border-radius:8px}
.tools button:hover{color:var(--ac);background:#ffffff10}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:#0b1120ee;backdrop-filter:blur(10px)}
.comp input{flex:1;border-radius:99px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(100%,420px);z-index:60;background:var(--sf2);border-left:1px solid var(--ln);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none;box-shadow:-20px 0 60px #000a}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln)}
.ph h3{font:800 20px var(--h)}
.tabs{display:flex;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{flex:none;padding:11px 14px;color:var(--mu);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
.tab{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.tab:not(.on){display:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:slideUp .4s both}
.card h4{font:800 15px var(--h)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:center;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .box{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;width:min(100%,420px);max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:10px;animation:popIn .3s}
@keyframes popIn{from{opacity:0;transform:scale(.92)}}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes floatY{50%{transform:translateY(-5px)}}
@keyframes pulse{50%{box-shadow:0 0 22px #8b5cf688}}
.dmc{width:min(100%,420px);height:min(80dvh,640px);display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:22px;overflow:hidden;animation:popIn .3s}
.dml{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.dmi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;transition:.2s;cursor:pointer}
.dmi:hover{background:#ffffff0d;transform:translateX(3px)}
.dmi .av{width:44px;height:44px;box-shadow:0 0 0 2px var(--ac)}
.dmch{flex:1;display:flex;flex-direction:column;min-height:0}
.dmm{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.dmb{display:flex;flex-direction:column;max-width:78%;animation:msgIn .3s}
.dmb.mine{align-self:flex-end;align-items:flex-end}
.dmb .bub{border-radius:18px;background:#1f2937}
.dmb.mine .bub{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.dmf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln)}
.dmf input{flex:1;border-radius:99px}
.dmf .btn.pri{border-radius:99px}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.rv{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;animation:slideUp .4s}
.rv video,.rv img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.rmeta{padding:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ract{display:flex;gap:6px}
.ract button{color:var(--mu);font-size:14px}
.ract button.on{color:var(--rd)}
.mc{position:fixed;inset:0;z-index:70;background:#050810;display:none}
.mc.on{display:block}
.mc canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.mc-x{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.mc-hb{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#000a;border:1px solid var(--ln);border-radius:14px;padding:6px}
.mc-hb button{width:38px;height:38px;border-radius:8px;background:#182238}
.mc-hb button.on{outline:2px solid #fff}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ac);color:#fff;font-weight:600;padding:9px 16px;border-radius:99px;animation:msgIn .3s}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:9px;background:var(--rd);color:#fff;font:700 10px/16px var(--b);text-align:center}
@media(max-width:640px){.brand p{display:none}.panel{width:100%}.m{max-width:92%}}
</style>
</head>
<body>

<header class="top">
 <div class="brand"><div><h1>Anonim Chat</h1><p>Canlı sohbet</p></div></div>
 <div class="acts">
  <button id="dmB" class="ib"><i class="fa-solid fa-envelope"></i><b id="dmDot" class="badge" hidden>0</b></button>
  <button id="gameB" class="ib"><i class="fa-solid fa-cube"></i></button>
  <button id="setB" class="ib"><i class="fa-solid fa-gear"></i></button>
  <button id="me" class="pill me">Profil</button>
  <button id="adm" class="btn"><i class="fa-solid fa-shield-halved"></i><span id="admT">Giriş</span></button>
 </div>
</header>

<main id="stream" class="stream"></main>

<form id="form" class="comp" autocomplete="off">
 <input id="msg" maxlength="300" placeholder="Bir şey yaz…">
 <button class="btn pri" id="sendB"><i class="fa-solid fa-paper-plane"></i></button>
</form>

<aside id="panel" class="panel">
 <div class="ph"><h3>Yönetim</h3><button class="ib" id="pX"><i class="fa-solid fa-xmark"></i></button></div>
 <div class="tabs">
  <button data-tab="ch" class="on">Sohbet</button>
  <button data-tab="us">Kişiler</button>
  <button data-tab="re">Reels</button>
 </div>
 <div class="tab on" id="t-ch">
  <div class="card"><h4>Sohbeti temizle</h4><button class="btn red" id="clr">Tüm mesajları sil</button></div>
  <div class="card"><h4>Sohbeti kilitle</h4><button class="btn" id="lock">Kilit aç/kapat</button></div>
 </div>
 <div class="tab" id="t-us">
  <div class="card"><h4>Kullanıcılar</h4><div id="uList"></div></div>
  <div class="card"><h4>Rol ver</h4><div class="row"><input id="rUid" placeholder="Kullanıcı ID"><select id="rRole"><option value="user">Kullanıcı</option><option value="mod">Moderatör</option><option value="admin">Yönetici</option></select><button class="btn pri" id="rSet">Uygula</button></div></div>
 </div>
 <div class="tab" id="t-re">
  <div class="card"><h4>Reels ekle</h4><input id="rUrl" placeholder="Video linki"><input id="rCap" placeholder="Açıklama"><button class="btn pri" id="rAdd">Paylaş</button></div>
 </div>
</aside>

<div id="mLogin" class="modal" hidden><div class="box"><h3>Yönetici girişi</h3><input id="pw" type="password" placeholder="Şifre"><div class="row"><button class="btn" data-x>Vazgeç</button><button class="btn pri" id="loginB" style="flex:1">Giriş</button></div></div></div>

<div id="mDm" class="modal" hidden><div class="dmc">
 <div class="ph"><h3>Mesajlar</h3><button class="ib" data-x><i class="fa-solid fa-xmark"></i></button></div>
 <div id="dmList" class="dml"></div>
 <div id="dmChat" class="dmch" hidden>
  <div class="ph"><button class="ib" id="dmBack"><i class="fa-solid fa-arrow-left"></i></button><h3 id="dmTitle">Sohbet</h3></div>
  <div id="dmMsgs" class="dmm"></div>
  <form id="dmForm" class="dmf"><input id="dmIn" placeholder="Mesaj yaz…"><button class="btn pri"><i class="fa-solid fa-paper-plane"></i></button></form>
 </div>
</div></div>

<div id="mSet" class="modal" hidden><div class="box">
 <h3>Ayarlar</h3>
 <input id="sNick" placeholder="Rumuz">
 <input id="sBio" placeholder="Hakkımda">
 <label class="row"><input type="checkbox" id="sPriv"> Hesabımı gizli yap</label>
 <button class="btn pri" id="sSave">Kaydet</button>
</div></div>

<div id="mGame" class="modal" hidden><div class="box">
 <h3>Minecraft Mini</h3>
 <p class="small">Blokları kır, yerleştir, hareket et.</p>
 <button class="btn pri" id="mcStart">Oyunu başlat</button>
</div></div>

<div id="mc" class="mc">
 <div class="mc-x"><button class="btn sm" id="mcExit">Çık</button><span class="pill">WASD / Ok tuşları</span></div>
 <canvas id="mcC"></canvas>
 <div class="mc-hb" id="mcBar"></div>
</div>

<div id="mReels" class="modal" hidden><div class="box">
 <h3>Reels</h3>
 <div id="reelList" class="reels"></div>
 <button class="btn" data-x>Kapat</button>
</div></div>

<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const F=()=>window.FB,R=p=>F().ref(F().db,p);
let me={uid:localStorage.c_uid||(localStorage.c_uid='u'+Math.random().toString(36).slice(2,10)),name:localStorage.c_name||'Anonim',role:'user',bio:'',private:false};
let users={},msgs={},dms={},reels={},dmTo=null;
const ADMIN_PASS='admin123';

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),2200)}
function open(id){$(id).hidden=false}
function close(id){$(id).hidden=true}
$$('[data-x]').forEach(b=>b.onclick=()=>b.closest('.modal').hidden=true);

function paintMe(){
 $('#me').textContent=me.name;
 $('#admT').textContent=me.role==='admin'?'Yönetici':me.role==='mod'?'Moderatör':'Giriş';
 $('#me').className='pill me '+(me.role==='user'?'':me.role);
}
function avatar(u,n){const c='hsl('+((u.charCodeAt(0)*37)%360)+' 70% 60%)';return `<div class="av" style="--c:${c}">${esc((n||'?')[0]?.toUpperCase()||'?')}</div>`}

function start(){
 const f=F();
 f.onValue(R('users'),s=>{users=s.val()||{};const r=users[me.uid];if(r){me.role=r.role||'user';me.name=r.name||me.name;me.bio=r.bio||'';me.private=!!r.private}paintMe();renderUsers()});
 f.onValue(f.query(R('messages'),f.orderByKey(),f.limitToLast(80)),s=>{const v=s.val()||{};msgs=v;renderMsgs()});
 f.onValue(R('dms/'+me.uid),s=>{dms=s.val()||{};renderDmList()});
 f.onValue(R('reels'),s=>{reels=s.val()||{};renderReels()});
}
if(window.FB)start();else addEventListener('fb',start);

function renderMsgs(){
 const s=$('#stream');s.innerHTML='';
 Object.entries(msgs).sort((a,b)=>a[1].ts-b[1].ts).forEach(([k,m])=>{
  const el=document.createElement('div');
  el.className='m'+(m.uid===me.uid?' me':'')+(m.role==='admin'?' adm':m.role==='mod'?' mod':'');
  el.innerHTML=`${avatar(m.uid,m.name)}<div class="mb"><div class="mh"><b>${esc(m.name)}</b>${m.role!=='user'?`<span class="tag${m.role==='mod'?' mod':''}">${m.role==='admin'?'Yönetici':'Mod'}</span>`:''}<span>${esc(m.time||'')}</span></div><div class="bub">${esc(m.text)}</div><div class="tools"><button data-like="${k}"><i class="fa-regular fa-heart"></i></button><button data-repost="${k}"><i class="fa-solid fa-retweet"></i></button><button data-fav="${k}"><i class="fa-regular fa-bookmark"></i></button></div></div>`;
  s.append(el);
 });
 s.scrollTop=s.scrollHeight;
}
$('#stream').onclick=e=>{
 const l=e.target.closest('[data-like]'),r=e.target.closest('[data-repost]'),f=e.target.closest('[data-fav]');
 if(l){const k=l.dataset.like;F().update(R('messages/'+k+'/likes/'+me.uid),true);toast('Beğendin')}
 if(r){const k=r.dataset.repost;F().update(R('messages/'+k+'/reposts/'+me.uid),true);toast('Repost yapıldı')}
 if(f){const k=f.dataset.fav;F().update(R('messages/'+k+'/favs/'+me.uid),true);toast('Favorilere eklendi')}
};
$('#form').onsubmit=e=>{
 e.preventDefault();
 const t=$('#msg').value.trim();if(!t)return;
 const d=new Date();
 F().push(R('messages'),{uid:me.uid,name:me.name,role:me.role,text:t,time:d.getHours()+':'+d.getMinutes(),ts:Date.now()});
 $('#msg').value='';
};

/* DM */
$('#dmB').onclick=()=>{open('#mDm');renderDmList()};
function renderDmList(){
 const l=$('#dmList');l.innerHTML='';
 Object.entries(users).filter(([u])=>u!==me.uid).forEach(([u,r])=>{
  const el=document.createElement('div');el.className='dmi';
  el.innerHTML=`${avatar(u,r.name)}<div><b>${esc(r.name)}</b><small>${r.private?'Gizli hesap':'Mesaj gönder'}</small></div>`;
  el.onclick=()=>openDm(u);
  l.append(el);
 });
}
function openDm(u){
 dmTo=u;$('#dmList').hidden=true;$('#dmChat').hidden=false;
 $('#dmTitle').textContent=users[u]?.name||u;
 F().onValue(R('dm/'+[me.uid,u].sort().join('_')),s=>{
  const v=s.val()||{};const box=$('#dmMsgs');box.innerHTML='';
  Object.values(v).sort((a,b)=>a.ts-b.ts).forEach(m=>{
   const el=document.createElement('div');el.className='dmb'+(m.from===me.uid?' mine':'');
   el.innerHTML=`<div class="bub">${esc(m.text)}</div>`;
   box.append(el);
  });
  box.scrollTop=box.scrollHeight;
 });
}
$('#dmBack').onclick=()=>{$('#dmChat').hidden=true;$('#dmList').hidden=false};
$('#dmForm').onsubmit=e=>{
 e.preventDefault();
 const t=$('#dmIn').value.trim();if(!t||!dmTo)return;
 F().push(R('dm/'+[me.uid,dmTo].sort().join('_')),{from:me.uid,to:dmTo,text:t,ts:Date.now()});
 $('#dmIn').value='';
};

/* Profil */
$('#me').onclick=()=>{open('#mSet');$('#sNick').value=me.name;$('#sBio').value=me.bio;$('#sPriv').checked=me.private};
$('#sSave').onclick=()=>{
 const n=$('#sNick').value.trim()||me.name;
 me.name=n;me.bio=$('#sBio').value.trim();me.private=$('#sPriv').checked;
 localStorage.c_name=n;
 F().update(R('users/'+me.uid),{name:n,bio:me.bio,private:me.private,role:me.role});
 close('#mSet');toast('Kaydedildi');paintMe();
};

/* Admin */
$('#adm').onclick=()=>me.role==='user'?open('#mLogin'):open('#panel');
$('#loginB').onclick=()=>{
 if($('#pw').value!==ADMIN_PASS)return toast('Şifre yanlış');
 me.role='admin';F().update(R('users/'+me.uid),{role:'admin',name:me.name});
 close('#mLogin');open('#panel');paintMe();toast('Yönetici girişi yapıldı');
};
$('#pX').onclick=()=>close('#panel');
$$('.tabs button').forEach(b=>b.onclick=()=>{
 $$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 $$('.tab').forEach(x=>x.classList.remove('on'));$('#t-'+b.dataset.tab).classList.add('on');
});
$('#clr').onclick=()=>{if(confirm('Tüm mesajlar silinsin mi?')){F().remove(R('messages'));toast('Sohbet temizlendi')}};
$('#lock').onclick=()=>{const l=!$('#form').hidden;$('#form').hidden=l;toast(l?'Sohbet kilitlendi':'Sohbet açıldı')};
function renderUsers(){
 const l=$('#uList');if(!l)return;l.innerHTML='';
 Object.entries(users).forEach(([u,r])=>{
  const el=document.createElement('div');el.className='row';
  el.innerHTML=`<span>${esc(r.name)}</span><span class="tag">${r.role||'user'}</span>`;
  l.append(el);
 });
}
$('#rSet').onclick=()=>{
 const u=$('#rUid').value.trim(),r=$('#rRole').value;
 if(!u)return toast('ID gir');
 F().update(R('users/'+u),{role:r});toast('Rol güncellendi');
};

/* Reels */
$('#gameB').onclick=()=>open('#mReels');
$('#rAdd').onclick=()=>{
 const url=$('#rUrl').value.trim(),cap=$('#rCap').value.trim();
 if(!url)return toast('Link gir');
 F().push(R('reels'),{uid:me.uid,name:me.name,url,cap,ts:Date.now(),likes:{},reposts:{},favs:{}});
 $('#rUrl').value='';$('#rCap').value='';toast('Reels paylaşıldı');
};
function renderReels(){
 const l=$('#reelList');l.innerHTML='';
 Object.entries(reels).sort((a,b)=>b[1].ts-a[1].ts).forEach(([k,r])=>{
  const el=document.createElement('div');el.className='rv';
  el.innerHTML=`<video src="${esc(r.url)}" controls muted loop playsinline></video><div class="rmeta"><small>${esc(r.name)}</small><div class="ract"><button data-rp="${k}"><i class="fa-solid fa-retweet"></i></button><button data-fv="${k}"><i class="fa-regular fa-bookmark"></i></button></div></div>`;
  l.append(el);
 });
}
$('#reelList').onclick=e=>{
 const r=e.target.closest('[data-rp]'),f=e.target.closest('[data-fv]');
 if(r){F().update(R('reels/'+r.dataset.rp+'/reposts/'+me.uid),true);toast('Repost yapıldı')}
 if(f){F().update(R('reels/'+f.dataset.fv+'/favs/'+me.uid),true);toast('Favorilere eklendi')}
};

/* Minecraft mini */
$('#setB').onclick=()=>open('#mGame');
$('#mcStart').onclick=()=>{close('#mGame');$('#mc').classList.add('on');startMc()};
$('#mcExit').onclick=()=>$('#mc').classList.remove('on');
function startMc(){
 const c=$('#mcC'),x=c.getContext('2d');let px=100,py=100;
 const blocks=Array.from({length:20},()=>({x:Math.random()*400,y:Math.random()*300,w:30,h:30,c:'#4ade80'}));
 function draw(){
  x.fillStyle='#0b1020';x.fillRect(0,0,c.width,c.height);
  blocks.forEach(b=>{x.fillStyle=b.c;x.fillRect(b.x,b.y,b.w,b.h)});
  x.fillStyle='#8b5cf6';x.fillRect(px,py,24,24);
  requestAnimationFrame(draw);
 }
 c.width=innerWidth;c.height=innerHeight;
 draw();
 addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')px-=10;if(e.key==='ArrowRight')px+=10;
  if(e.key==='ArrowUp')py-=10;if(e.key==='ArrowDown')py+=10;
 });
}

paintMe();
</script>
